{% extends "template.html" %}

{% block titulo %}
Esqueci a senha
{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <section class="content-card">
            <div class="text-center content-card-header">
                <img class="brand-mark" src="{{ url_for('static', filename='img.png') }}" alt="Logo do sistema">
                <h1 class="section-title mt-3 mb-2">Recuperar senha</h1>
                <p class="section-subtitle mb-0">Informe seu e-mail para receber um link de redefinicao de senha.</p>
            </div>

                <form method="POST" action="/buscasenha" class="d-grid gap-3">
                    {{ csrf_token_field() }}
                    <div>
                    <label class="form-label" for="email">E-mail</label>
                    <input class="form-control inputlogin" id="email" type="email" name="email" placeholder="nome@empresa.com">
                </div>
                <button class="btn btn-brand botaologin w-100" type="submit">Enviar link</button>
            </form>
        </section>
    </div>
</div>
{% endblock %}
